<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utsav Inventory Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f8f0db;--sf:#fffdf5;--ln:#e8d6a6;--tx:#4a3510;--mu:#656b73;--gd:#b88a2a;--rb:#b0163a}
body{font:15px/1.5 Jost,system-ui,sans-serif;background:var(--bg);color:var(--tx)}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:#efe0b3;color:var(--tx);font-weight:500}button:hover{filter:brightness(.97)}
button.pr{background:linear-gradient(135deg,#f0d684,#c9a24a);color:#3d2a06;border:1px solid var(--gd)}button.d{background:#fbe6ea;color:var(--rb)}button.g{background:transparent;border:1px solid var(--ln)}button.sm{padding:6px 12px;font-size:13px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;font:inherit;color:var(--tx)}textarea{min-height:90px;resize:vertical}
#lg{max-width:380px;margin:12vh auto;background:var(--sf);padding:30px;border-radius:16px;box-shadow:0 8px 30px #0002}#lg h2{font:600 28px "Cormorant Garamond",serif;margin-bottom:6px}#lg input{margin:6px 0 12px}
#app{display:none}#sb{position:fixed;left:0;top:0;bottom:0;width:272px;background:var(--sf);border-right:1px solid var(--ln);overflow-y:auto;padding:18px 12px 30px;z-index:30;transition:.25s}
.lgo{font:600 26px "Cormorant Garamond",serif;letter-spacing:.12em;padding:4px 10px 14px}.lgo small{display:block;font:500 10px Jost;letter-spacing:.2em;color:var(--gd);text-transform:uppercase}
#sb a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14.5px}#sb a:hover{background:#f6ecd0}#sb a.on{background:linear-gradient(135deg,#f0d684,#e1bd62);font-weight:600}#sb a em{font-style:normal;font-size:11px;color:var(--mu)}
#sb .sub{margin-left:14px;border-left:2px solid var(--ln);padding-left:6px}#sb p{font:500 11px Jost;letter-spacing:.18em;text-transform:uppercase;color:var(--gd);padding:16px 12px 4px}
#tb{display:none;position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 14px;align-items:center;gap:12px}
#mn{margin-left:272px;padding:28px 34px 80px;max-width:1180px}.crumb{font-size:13px;color:var(--mu);margin-bottom:6px}.crumb a{color:var(--gd);cursor:pointer}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}.ph h1{font:600 clamp(26px,3vw,36px)/1.15 "Cormorant Garamond",serif}.ph p{color:var(--mu);max-width:640px;margin-top:4px;font-size:14px}.ph .ac{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 20px;margin-bottom:16px}.card h3{font:600 20px "Cormorant Garamond",serif;margin-bottom:8px}.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}.kv b{color:var(--mu);font-weight:500}
.r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;margin-bottom:8px}.r img{width:52px;height:64px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
.r .c{flex:1;min-width:170px}.r .c b{display:block;font-weight:600}.r .c small{color:var(--mu);font-size:12.5px}.r .m{min-width:84px;font-size:14px}.r .a{display:flex;gap:6px;margin-left:auto}.st{font-size:20px;padding:4px 10px;background:transparent;color:var(--gd)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:#efe0b3}.tag.ok{background:#dcf2e4;color:#17683f}.tag.no{background:#fbe6ea;color:var(--rb)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{max-width:280px}.empty{padding:26px;text-align:center;color:var(--mu);background:var(--sf);border:1px dashed var(--ln);border-radius:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.gal div{position:relative}.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}.gal button{position:absolute;top:6px;right:6px;padding:2px 8px;background:#fffd;color:var(--rb)}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}#ov.o{display:flex}.md{background:var(--sf);border-radius:16px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #0006}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--ln)}.mh h3{font:600 24px "Cormorant Garamond",serif}.x{background:none;font-size:18px;padding:4px 10px}.nt{padding:10px 22px 0;color:var(--mu);font-size:13px}
.md form{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}.mb2{padding:14px 22px;overflow-y:auto;flex:1;min-height:0}.mf{flex:none;background:var(--sf);border-radius:0 0 16px 16px}.mf .pr{min-width:120px}.mb2 label{display:block;font-weight:500;font-size:13.5px;margin-bottom:14px}.mb2 label>input,.mb2 label>textarea,.mb2 label>select{margin-top:5px}.mb2 label.ck{display:flex;gap:10px;align-items:center}.mb2 .ck input{width:auto}
.im{display:flex;gap:12px;align-items:center;margin-top:5px}.im img{width:64px;height:80px;object-fit:cover;border-radius:8px;background:#eee}.er{color:var(--rb);padding:0 22px;font-size:13.5px;min-height:0}.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--ln)}
#ts{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#3d2a06;color:#f6e3a1;padding:11px 22px;border-radius:26px;opacity:0;transition:.3s;z-index:80;pointer-events:none}#ts.s{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){#sb{transform:translateX(-100%)}#sb.o{transform:none;box-shadow:0 0 40px #0005}#tb{display:flex}#mn{margin-left:0;padding:18px 14px 80px}.kv{grid-template-columns:1fr}}
</style></head><body>
<div id="lg"><h2>Utsav Inventory Manager</h2><p style="color:var(--mu);margin-bottom:14px">Owner login</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="pr" onclick="login()" style="width:100%">Login</button><p style="margin-top:14px;text-align:center"><a href="/" style="color:var(--gd)">← Back to website</a></p></div>
<div id="app"><div id="tb"><button onclick="$('#sb').classList.toggle('o')">☰ Menu</button><b>Utsav Inventory</b></div><nav id="sb"></nav><main id="mn"></main></div><div id="ov"></div><div id="ts"></div>
<script>
let T=sessionStorage.t,db,V='home',PC='',Q='',CF='',PG=40,$=s=>document.querySelector(s);
const H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+T}),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+(+n||0).toLocaleString('en-IN');
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),2200)};
async function login(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({user:$('#u').value,pass:$('#p').value})});let j={};try{j=await r.json()}catch{}if(!r.ok)return alert(j.error||'Invalid login');T=j.token;sessionStorage.t=T;start()}
async function start(){const r=await fetch('/api/admin/db',{headers:H()});if(!r.ok){sessionStorage.removeItem('t');return}db=await r.json();$('#lg').style.display='none';$('#app').style.display='block';render()}
function expire(){sessionStorage.removeItem('t');alert('Your session ended. Please log in again.');location.reload()}
async function saveDB(m){const r=await fetch('/api/admin/db',{method:'PUT',headers:H(),body:JSON.stringify({site:db.site,sections:db.sections,categories:db.categories,products:db.products})});if(r.status==401)return expire();toast(r.ok?(m||'Saved ✓ - website updated'):'Could not save');return r.ok}
async function refresh(){const r=await fetch('/api/admin/db',{headers:H()});if(r.status==401)return expire();if(r.ok){const d=await r.json();db.bookings=d.bookings;db.slots=d.slots;db.feedback=d.feedback;db.users=d.users}}
async function item(kind,id,action,value){const r=await fetch('/api/admin/item',{method:'POST',headers:H(),body:JSON.stringify({kind,id,action,value})});if(r.status==401)return expire();toast(r.ok?'Saved ✓':'Could not save');return r.ok}
const SN={collections:'Explore Collections',bookings:'Book Your Beauty Session',parlour:'Parlour Services',trending:'Trending',spotlight:'Spotlight',couple:'Couple Collection',classes:'Beauty Classes',gallery:'Gallery',about:'About Us',feedback:'Customer Feedback'};
const sn=s=>SN[s.id]||s.title||s.id,cat=id=>db.categories.find(c=>c.id==id),cn=id=>(cat(id)||{}).name||id,cnt=id=>db.products.filter(p=>p.cat==id).length,prod=id=>db.products.find(p=>p.id==id),sec=id=>db.sections.find(s=>s.id==id);
const nav=(v,l,n)=>`<a class="${V==v?'on':''}" onclick="go('${v}')"><span>${E(l)}</span>${n!=null?`<em>${n}</em>`:''}</a>`;
function side(){const C=g=>db.categories.filter(c=>c.group==g).map(c=>nav('cat:'+c.id,c.name,cnt(c.id))).join('');return`<div class="lgo">UTSAV<small>Inventory manager</small></div>${nav('home','🏠 Home page')}<div class="sub">${nav('hero','Hero banner')}${db.sections.map(s=>nav('sec:'+s.id,sn(s))).join('')}</div><p>👗 Collections</p>${C('collection')}<p>💄 Parlour services</p>${C('parlour')}<p>All items</p>${nav('products','📦 All products',db.products.length)}<p>Orders</p>${nav('bookings','🧾 Rental bookings',(db.bookings||[]).length)}${nav('slots','📅 Slot requests',(db.slots||[]).length)}${nav('customers','👤 Customers',(db.users||[]).length)}${nav('feedback','💬 Feedback')}<p>Website settings</p>${nav('menu','🧭 Header & menu')}${nav('footer','📍 Footer & contact')}${nav('payment','💳 Payment & booking form')}${nav('security','🔑 Password')}<p></p><a onclick="window.open('/')">🌐 View website</a><a onclick="sessionStorage.removeItem('t');location.reload()">⎋ Log out</a>`}
async function go(v){V=v;if(/^(bookings|slots|customers|feedback)$/.test(v))await refresh();Q='';CF='';PG=40;if(v.startsWith('cat:'))PC=v.slice(4);render();$('#sb').classList.remove('o');scrollTo(0,0)}
function render(){$('#sb').innerHTML=side();$('#mn').innerHTML=page()}
const ph=(cr,t,d,ac)=>`<div class="crumb">${cr.map((x,i)=>i<cr.length-1?`<a onclick="go('${x[1]}')">${E(x[0])}</a> › `:E(x)).join('')}</div><div class="ph"><div><h1>${E(t)}</h1><p>${d||''}</p></div><div class="ac">${ac||''}</div></div>`;
const hs=(a,b)=>[['Home page','home'],b||a],B=(l,f,c)=>`<button class="${c||''}" onclick="${f}">${l}</button>`;
function page(){const[a,b]=V.split(':');
if(a=='home')return home();if(a=='hero')return heroP();if(a=='sec')return secP(sec(b));if(a=='cat')return catP(b);if(a=='products')return prodsP();
if(a=='bookings')return bookP();if(a=='slots')return slotP();if(a=='customers')return custP();if(a=='feedback')return fbP();if(a=='menu')return menuP();if(a=='footer')return footP();if(a=='payment')return payP();if(a=='security')return secuP();return''}
/* ---------- forms ---------- */
function fld(f,d){const v=d[f.k]??f.v??'',n=f.k,l=E(f.l);
if(f.t=='area')return`<label>${l}<textarea name="${n}">${E(v)}</textarea></label>`;
if(f.t=='num')return`<label>${l}<input name="${n}" type="number" step="any" value="${E(v)}"></label>`;
if(f.t=='chk')return`<label class="ck"><input type="checkbox" name="${n}" ${v?'checked':''}> ${l}</label>`;
if(f.t=='lines')return`<label>${l}<textarea name="${n}" placeholder="One per line">${E([].concat(v).join('\n'))}</textarea></label>`;
if(f.t=='sel'){let o=f.o.map(x=>[].concat(x));o=o.some(x=>x[0]==v)||v===''?o:[...o,[v,String(v)]];return`<label>${l}<select name="${n}">${o.map(x=>`<option value="${E(x[0])}" ${x[0]==v?'selected':''}>${E(x[1]??x[0])}</option>`).join('')}</select></label>`}
if(f.t=='img')return`<label>${l}<div class="im"><img id="pv_${n}" src="${E(v)}" alt=""><div style="flex:1"><input type="hidden" name="${n}" value="${E(v)}"><input type="file" accept="image/*" onchange="upl(this,'${n}')"><small id="us_${n}" style="color:var(--mu)">Choose a photo from your device</small></div></div></label>`;
return`<label>${l}<input name="${n}" value="${E(v)}"></label>`}
function form(o){const ov=$('#ov');ov.innerHTML=`<div class="md"><div class="mh"><h3>${E(o.title)}</h3><button class="x" type="button" onclick="closeForm()">✕</button></div>${o.note?`<p class="nt">${E(o.note)}</p>`:''}<form id="ff"><div class="mb2">${o.fields.map(f=>fld(f,o.data||{})).join('')}</div><p class="er" id="er"></p><div class="mf"><button type="button" class="g" onclick="closeForm()">Cancel</button><button type="submit" class="pr">${E(o.submit||'Done')}</button></div></form></div>`;ov.classList.add('o');
$('#ff').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),v={};for(const f of o.fields){const r=fd.get(f.k);v[f.k]=f.t=='chk'?fd.has(f.k):f.t=='num'?(+r||0):f.t=='lines'?String(r||'').split('\n').map(x=>x.trim()).filter(Boolean):String(r??'').trim()}const er=o.validate&&o.validate(v);if(er){$('#er').textContent=er;return}await o.onSave(v);closeForm()}}
function closeForm(){$('#ov').classList.remove('o');$('#ov').innerHTML=''}
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function up1(file){const x=await fetch('/api/admin/upload',{method:'POST',headers:H(),body:JSON.stringify({data:await shrink(file)})});if(x.status==401)return expire();if(!x.ok)throw 0;return(await x.json()).url}
async function upl(el,k){const f=el.files[0];if(!f)return;const s=$('#us_'+k);s.textContent='Uploading…';try{const u=await up1(f);document.querySelector(`input[name="${k}"]`).value=u;$('#pv_'+k).src=u;s.textContent='Photo ready ✓'}catch{s.textContent='Upload failed, try another photo'}}
const dest=()=>[['Home: Explore Collections','#/sec/collections'],['Book a slot page','#/book'],['Book a class','#/book/class'],['Gallery page','#/gallery'],...db.categories.map(c=>['Page: '+c.name,'#/c/'+c.id])];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item';
/* ---------- home ---------- */
function home(){return ph([['Home page','home']].slice(0,0).concat(['Home page']),'Home page','These are the sections of your website’s home page, in the same order visitors see them. Use the arrows to move a section, or Hide it. Click Open to change what is inside.')+`<div class="r"><div class="c"><b>Hero banner</b><small>The big picture and welcome text at the very top</small></div><div class="a">${B('Open','go(\'hero\')')}</div></div>`+db.sections.map((s,i)=>`<div class="r"><div class="c"><b>${E(sn(s))}</b><small>${s.enabled?'Visible on website':'Hidden'}</small></div><span class="tag ${s.enabled?'ok':'no'}">${s.enabled?'Visible':'Hidden'}</span><div class="a"><button class="sm g" onclick="mv(${i},-1)" ${i?'':'disabled'}>▲</button><button class="sm g" onclick="mv(${i},1)" ${i<db.sections.length-1?'':'disabled'}>▼</button>${B(s.enabled?'Hide':'Show','tgs('+i+')','sm')}${B('Open','go(\'sec:'+s.id+'\')','sm pr')}</div></div>`).join('')}
async function mv(i,d){const a=db.sections,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();await saveDB()}
async function tgs(i){db.sections[i].enabled=!db.sections[i].enabled;render();await saveDB()}
function heroP(){const h=db.site.hero;return ph(hs(['Hero banner']),'Hero banner','The first thing visitors see: a large picture with your title and button.',B('✎ Edit','editHero()','pr'))+`<div class="card"><div class="kv"><b>Picture</b><span><img src="${E(h.imgW)}" style="height:90px;border-radius:8px"></span><b>Small line</b><span>${E(h.kicker)}</span><b>Main title</b><span>${E(h.title)}</span><b>Sub title</b><span>${E(h.sub)}</span><b>Services line</b><span>${E((h.list||[]).join(' • '))}</span><b>Button</b><span>${E(h.btn)}</span></div></div>`}
function editHero(){const h=db.site.hero;form({title:'Edit hero banner',data:h,fields:[{k:'imgW',l:'Banner picture',t:'img'},{k:'kicker',l:'Small line above the title'},{k:'title',l:'Main title'},{k:'sub',l:'Sub title'},{k:'list',l:'Services line',t:'lines'},{k:'btn',l:'Button text'},{k:'btnLink',l:'Button opens',t:'sel',o:dest()}],onSave:async v=>{Object.assign(h,v);render();await saveDB()}})}
/* ---------- sections ---------- */
function secP(s){if(!s)return'';const t=s.type,D={collections:'The row of collection cards near the top of your home page. Each card opens a page of products.',bookings:'Large picture cards that lead visitors to the beauty services.',parlour:'The row of beauty service cards.',trending:'Products shown under “Trending” on the home page.',spotlight:'Rows of featured products, one row per category you choose.',couple:'A large picture with text and a button for your couple collection.',classes:'A large picture with text and a button for your beauty classes.',gallery:'The photo gallery on your home page. “View more” opens the full gallery.',about:'The About Us text.',feedback:'Customer feedback shown on the home page.'}[s.id]||'';
const top=ph(hs([sn(s)],[sn(s)]),sn(s),D,`<button onclick="window.open('/#/sec/${s.id}')" class="g">👁 View on website</button>`+(t=='feature'?'':B('✎ Heading & text','editSec(\''+s.id+'\')')));
let b='';
if(t=='cats'||t=='posters')b=catList(s.group);
else if(t=='prods')b=trendP();
else if(t=='spotrows')b=`<div class="tools">${B('+ Add a row','editRow()','pr')}</div>`+(s.rows||[]).map((r,i)=>`<div class="r"><div class="c"><b>${E(r.title)}</b><small>Shows 6 products from: ${E(cn(r.cat))} (${cnt(r.cat)} available)</small></div><div class="a">${B('Edit','editRow('+i+')','sm')}${B('Delete','delRow('+i+')','sm d')}</div></div>`).join('');
else if(t=='feature')return top+`<div class="card"><div class="kv"><b>Picture</b><span><img src="${E(s.image)}" style="height:90px;border-radius:8px"></span><b>Label</b><span>${E(s.eyebrow)}</span><b>Heading</b><span>${E(s.heading)}</span><b>Text</b><span>${E(s.text)}</span><b>Points</b><span>${E((s.items||[]).join(' • '))}</span><b>Button</b><span>${E(s.btn)}</span></div><p style="margin-top:12px">${B('✎ Edit','editFeat(\''+s.id+'\')','pr')}</p></div>`;
else if(t=='gallery')b=`<div class="tools"><label class="pr" style="padding:9px 16px;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#f0d684,#c9a24a);border:1px solid var(--gd)">+ Add photos<input type="file" accept="image/*" multiple style="display:none" onchange="addPh(this)"></label><span style="color:var(--mu);align-self:center">${s.images.length} photos. The first ones appear on the home page.</span></div><div class="gal">${s.images.map((u,i)=>`<div><img src="${E(u)}" loading="lazy"><button onclick="delPh(${i})">✕</button></div>`).join('')}</div>`;
else if(t=='text')b=`<div class="card"><h3>${E(s.title)}</h3><p>${E(s.text)}</p><p style="margin-top:12px">${B('✎ Edit text','editAbout()','pr')}</p></div>`;
else if(t=='feedback')b=`<div class="card"><p>Customer reviews are managed in the Feedback inbox.</p><p style="margin-top:12px">${B('Open Feedback inbox','go(\'feedback\')','pr')}</p></div>`;
return top+b}
function editSec(id){const s=sec(id);form({title:'Edit heading & text',data:s,fields:[{k:'enabled',l:'Show this section on the website',t:'chk'},{k:'title',l:'Heading'},{k:'sub',l:'Short line under the heading'},{k:'intro',l:'Paragraph',t:'area'}],onSave:async v=>{Object.assign(s,v);render();await saveDB()}})}
function editFeat(id){const s=sec(id);form({title:'Edit '+sn(s),data:s,fields:[{k:'image',l:'Picture',t:'img'},{k:'pill',l:'Badge on the picture'},{k:'eyebrow',l:'Small label'},{k:'heading',l:'Heading'},{k:'text',l:'Text',t:'area'},{k:'items',l:'Points (tick list)',t:'lines'},{k:'btn',l:'Button text'},{k:'link',l:'Button opens',t:'sel',o:dest()}],onSave:async v=>{Object.assign(s,v);render();await saveDB()}})}
function editAbout(){const s=sec('about');form({title:'Edit About Us',data:s,fields:[{k:'title',l:'Heading'},{k:'sub',l:'Short line'},{k:'text',l:'Text',t:'area'}],onSave:async v=>{Object.assign(s,v);render();await saveDB()}})}
function editRow(i){const s=sec('spotlight'),r=i==null?{title:'',cat:db.categories[0].id}:s.rows[i];form({title:i==null?'Add a spotlight row':'Edit spotlight row',submit:i==null?'Upload':'Done',data:r,fields:[{k:'title',l:'Row heading'},{k:'cat',l:'Show products from',t:'sel',o:db.categories.map(c=>[c.id,c.name])}],validate:v=>v.title?'':'Please enter a heading',onSave:async v=>{if(i==null)s.rows.push(v);else Object.assign(r,v);render();await saveDB()}})}
async function delRow(i){if(!confirm('Remove this row from Spotlight?'))return;sec('spotlight').rows.splice(i,1);render();await saveDB()}

/* ---------- categories ---------- */
function catList(g){const L=db.categories.filter(c=>c.group==g),w=g=='collection'?'collection':'service';return`<div class="tools">${B('+ Add '+w,'editCat(null,\''+g+'\')','pr')}</div>`+(L.map(c=>`<div class="r"><img src="${E(c.img)}" loading="lazy"><div class="c"><b>${E(c.name)}</b><small>ID: ${E(c.id)} · ${cnt(c.id)} products</small></div><div class="a">${B('Products','go(\'cat:'+c.id+'\')','sm pr')}${B('Edit','editCat(\''+c.id+'\')','sm')}${B('Delete','delCat(\''+c.id+'\')','sm d')}</div></div>`).join('')||'<div class="empty">Nothing here yet.</div>')}
function editCat(id,g){const c=id?cat(id):{name:'',img:'',banner:'',desc:'',blurb:'',cta:g=='parlour'?'Book Now':'Rent Now'};form({title:id?'Edit '+c.name:'Add '+(g=='parlour'?'service':'collection'),submit:id?'Done':'Upload',note:id?'ID: '+c.id:'An ID is created automatically from the name.',data:c,fields:[{k:'name',l:'Name'},{k:'img',l:'Card picture (home page)',t:'img'},{k:'banner',l:'Large banner picture (top of its page)',t:'img'},{k:'desc',l:'Short line (gold, on the banner)'},{k:'blurb',l:'Details paragraph',t:'area'},{k:'cta',l:'Button on its products',t:'sel',o:['Rent Now','Book Now']}],validate:v=>v.name?'':'Please enter a name',onSave:async v=>{if(id)Object.assign(c,v);else{let i=slug(v.name),n=2;while(cat(i))i=slug(v.name)+'-'+n++;db.categories.push({id:i,group:g,...v,banner:v.banner||v.img})}render();await saveDB()}})}
async function delCat(id){const n=cnt(id);if(!confirm('Delete "'+cn(id)+'"'+(n?' and its '+n+' products':'')+'? This cannot be undone.'))return;db.categories=db.categories.filter(c=>c.id!=id);db.products=db.products.filter(p=>p.cat!=id);sec('spotlight').rows=sec('spotlight').rows.filter(r=>r.cat!=id);if(V=='cat:'+id)V='home';render();await saveDB()}
function catP(id){const c=cat(id);if(!c)return'';return ph([['Home page','home'],[c.group=='parlour'?'Parlour services':'Collections','sec:'+(c.group=='parlour'?'parlour':'collections')],c.name],c.name,'Everything shown on the “'+E(c.name)+'” page of your website.',`<button class="g" onclick="window.open('/#/c/${c.id}')">👁 View on website</button>`+B('✎ Page details','editCat(\''+c.id+'\')')+B('+ Add product','pform(null,\''+c.id+'\')','pr'))+`<div class="tools"><input id="q" placeholder="Search in ${E(c.name)}…" oninput="Q=this.value;PG=40;$('#pl').innerHTML=plist()"></div><div id="pl">${plist()}</div>`}
/* ---------- products ---------- */
function prodsP(){return ph(hs(['All products']),'All products','Every product on your website. Each has a unique ID, the same ID you see in bookings.',B('+ Add product','pform(null,\'\')','pr'))+`<div class="tools"><input id="q" placeholder="Search by name or ID…" oninput="Q=this.value;PG=40;$('#pl').innerHTML=plist()"><select onchange="CF=this.value;PG=40;$('#pl').innerHTML=plist()"><option value="">All categories</option>${db.categories.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('')}</select></div><div id="pl">${plist()}</div>`}
const prow=p=>`<div class="r"><img src="${E(p.img)}" loading="lazy"><div class="c"><b>${E(p.name)}</b><small>ID: ${E(p.id)} · ${E(cn(p.cat))}</small></div><div class="m">${inr(p.price)}</div><div class="m"><span class="tag ${(p.stock||'Available')=='Available'?'ok':'no'}">${E(p.stock||'Available')}</span></div><button class="st" title="Trending" onclick="tgp('${p.id}')">${p.trending?'★':'☆'}</button><div class="a">${B('Edit','pform(prod(\''+p.id+'\'))','sm')}${B('Delete','delP(\''+p.id+'\')','sm d')}</div></div>`;
function plist(){const c=V.startsWith('cat:')?V.slice(4):CF,q=Q.toLowerCase();let L=db.products.filter(p=>(!c||p.cat==c)&&(!q||(p.name+' '+p.id).toLowerCase().includes(q)));const n=L.length;return(L.slice(0,PG).map(prow).join('')||'<div class="empty">No products found. Use “+ Add product”.</div>')+(n>PG?`<p style="text-align:center;margin-top:12px">${B('Show more ('+(n-PG)+' left)','PG+=40;$(\'#pl\').innerHTML=plist()','g')}</p>`:'')}
function newPid(c){let m=0;db.products.forEach(p=>{if(p.cat==c){const n=+p.id.slice(c.length+1);if(n>m)m=n}});return c+'-'+(m+1)}
function pform(p,c){const nw=!p;p=p||{cat:c||PC||db.categories[0].id,name:'',img:'',price:0,deposit:0,desc:'',stock:'Available',rating:4.5,reviews:10,trending:false};
form({title:nw?'Add product':'Edit product',submit:nw?'Upload':'Done',note:nw?'A unique Product ID is created when you upload.':'Product ID: '+p.id,data:p,fields:[{k:'cat',l:'Category',t:'sel',o:db.categories.map(c=>[c.id,c.name])},{k:'name',l:'Product name'},{k:'img',l:'Photo',t:'img'},{k:'price',l:'Price in ₹ (per day for rentals, per service for parlour)',t:'num'},{k:'deposit',l:'Refundable deposit in ₹ (rentals only)',t:'num'},{k:'desc',l:'Description',t:'area'},{k:'stock',l:'Availability',t:'sel',o:['Available','Only 1 left','Out of stock']},{k:'rating',l:'Rating (1 to 5)',t:'num'},{k:'reviews',l:'Number of reviews',t:'num'},{k:'trending',l:'Show in Trending',t:'chk'}],
validate:v=>!v.name?'Please enter the product name':!v.img?'Please add a photo':v.price<=0?'Please enter the price':'',
onSave:async v=>{if(nw){const q={id:newPid(v.cat),...v,trend:50,spotlight:false},i=db.products.findIndex(x=>x.cat==v.cat);db.products.splice(i<0?db.products.length:i,0,q);toast('Product '+q.id+' added')}else Object.assign(p,v);render();await saveDB()}})}
async function tgp(id){const p=prod(id);p.trending=!p.trending;render();await saveDB()}
async function delP(id){const p=prod(id);if(!confirm('Delete "'+p.name+'" (ID '+id+')? This cannot be undone.'))return;db.products=db.products.filter(x=>x.id!=id);render();await saveDB()}

const BS=['New','Confirmed','Picked up','Returned','Cancelled'],SS=['New','Confirmed','Done','Cancelled'];
const sel=(o,v,f)=>`<select style="width:auto" onchange="${f}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
function bookP(){const q=Q.toLowerCase();return ph(hs(['Rental bookings']),'Rental bookings','Orders placed by customers. The Product ID tells you exactly which item was booked.')+`<div class="tools"><input placeholder="Search by booking ID, product ID or customer…" oninput="Q=this.value;$('#bl').innerHTML=bl()"></div><div id="bl">${bl()}</div>`}
function bl(){const q=Q.toLowerCase(),L=(db.bookings||[]).filter(b=>!q||JSON.stringify(b).toLowerCase().includes(q));return L.map(b=>`<div class="r"><div class="c"><b>${E(b.id)} · ${E(b.product)}</b><small>Product ID: <b style="display:inline;color:var(--tx)">${E(b.productId)}</b> · ${E(b.name)} · ${E(b.phone)}</small></div><div class="m">${E(b.start||'')}${b.end?' to '+E(b.end):''}<br><small>${inr(b.payable)} (advance ${inr(b.advance)})</small></div>${sel(BS,b.status,"setSt('booking','"+b.id+"',this.value)")}<div class="a">${B('Details','showB(\''+b.id+'\')','sm')}${B('Delete','delIt(\'booking\',\''+b.id+'\')','sm d')}</div></div>`).join('')||'<div class="empty">No bookings yet.</div>'}
async function setSt(k,id,v){const L=k=='booking'?db.bookings:db.slots;L.find(x=>x.id==id).status=v;await item(k,id,'status',v)}
async function delIt(k,id){if(!confirm('Delete this record?'))return;const m={booking:'bookings',slot:'slots',feedback:'feedback'}[k];if(await item(k,id,'delete')){db[m]=db[m].filter(x=>x.id!=id);render()}}
function showB(id){const b=db.bookings.find(x=>x.id==id),R=[['Booking ID',b.id],['Product ID',b.productId],['Product',b.product],['Customer',b.name],['Phone',b.phone],['Email',b.email],['Pickup / service date',b.start],['Return date',b.end],['Days',b.days],['Size',b.size],['Delivery',b.mode],['Address',b.address],['Notes',b.notes],['Rent / price',inr(b.total)],['Deposit',inr(b.deposit)],['Total payable',inr(b.payable)],['Advance',inr(b.advance)],['Payment method',b.payment],['Placed on',(b.created||'').slice(0,10)],['Status',b.status]].filter(x=>x[1]!==''&&x[1]!=null);$('#ov').innerHTML=`<div class="md"><div class="mh"><h3>Booking ${E(b.id)}</h3><button class="x" onclick="closeForm()">✕</button></div><div class="mb2"><div class="kv">${R.map(x=>`<b>${x[0]}</b><span>${E(x[1])}</span>`).join('')}</div></div><div class="mf"><button class="pr" onclick="closeForm()">Close</button></div></div>`;$('#ov').classList.add('o')}
function slotP(){return ph(hs(['Slot requests']),'Slot requests','Appointments requested from the “Book a slot” page.')+((db.slots||[]).map(s=>`<div class="r"><div class="c"><b>${E(s.id)} · ${E({rental:'Wedding rental',parlour:'Beauty parlour',class:'Beauty class'}[s.type]||s.type)}</b><small>${E(s.name)} · ${E(s.phone)}${s.notes?' · '+E(s.notes):''}</small></div><div class="m">${E(s.date)} ${E(s.time)}</div>${sel(SS,s.status,"setSt('slot','"+s.id+"',this.value)")}<div class="a">${B('Delete','delIt(\'slot\',\''+s.id+'\')','sm d')}</div></div>`).join('')||'<div class="empty">No slot requests yet.</div>')}
function custP(){return ph(hs(['Customers']),'Customers','People who created an account on your website.')+((db.users||[]).map(u=>`<div class="r"><div class="c"><b>${E(u.name)}</b><small>${E(u.email)} · ${E(u.phone||'no phone')}</small></div><div class="m">${(db.bookings||[]).filter(b=>b.uid==u.id).length} bookings</div><div class="m"><small>Joined ${E((u.created||'').slice(0,10))}</small></div></div>`).join('')||'<div class="empty">No customers yet.</div>')}
function fbP(){return ph(hs(['Feedback']),'Customer feedback','Reviews sent from your website. Approve a review to show it on the home page.')+((db.feedback||[]).map(f=>`<div class="r"><div class="c"><b>${E(f.name)} ${'★'.repeat(f.rating||5)}</b><small>${E(f.text)}</small></div><span class="tag ${f.approved?'ok':'no'}">${f.approved?'Shown':'Hidden'}</span><div class="a">${B(f.approved?'Hide':'Approve','apF(\''+f.id+'\')','sm pr')}${B('Delete','delIt(\'feedback\',\''+f.id+'\')','sm d')}</div></div>`).join('')||'<div class="empty">No feedback yet.</div>')}
async function apF(id){const f=db.feedback.find(x=>x.id==id);f.approved=!f.approved;render();await item('feedback',id,'approve',f.approved)}
/* ---------- settings ---------- */
function menuP(){const s=db.site,n=s.nav;return ph(hs(['Header & menu']),'Header & menu','The logo name, search box text and the menu links at the top of every page.',B('✎ Edit logo & search','editBrand()','pr'))+`<div class="card"><div class="kv"><b>Logo name</b><span>${E(s.brand.name)}</span><b>Logo tagline</b><span>${E(s.brand.tag)}</span><b>Search box text</b><span>${E(s.searchPlaceholder)}</span></div></div><div class="tools">${B('+ Add menu link','editNav(null)','pr')}</div>`+n.map((x,i)=>`<div class="r"><div class="c"><b>${E(x.label)}</b><small>${E((dest().find(d=>d[1]==x.href)||[x.href,x.href])[0])}</small></div><div class="a">${B('Edit','editNav('+i+')','sm')}${B('Delete','delNav('+i+')','sm d')}</div></div>`).join('')}
function editBrand(){const s=db.site;form({title:'Edit logo & search',data:{name:s.brand.name,tag:s.brand.tag,ph:s.searchPlaceholder},fields:[{k:'name',l:'Logo name'},{k:'tag',l:'Logo tagline'},{k:'ph',l:'Search box text'}],onSave:async v=>{s.brand.name=v.name;s.brand.tag=v.tag;s.searchPlaceholder=v.ph;render();await saveDB()}})}
function editNav(i){const n=db.site.nav,x=i==null?{label:'',href:'#/'}:n[i];form({title:i==null?'Add menu link':'Edit menu link',submit:i==null?'Upload':'Done',data:x,fields:[{k:'label',l:'Link text'},{k:'href',l:'Opens',t:'sel',o:[['Home','#/'],['About Us section','#/sec/about'],...dest()]}],validate:v=>v.label?'':'Please enter the link text',onSave:async v=>{if(i==null)n.push(v);else Object.assign(x,v);render();await saveDB()}})}

function footP(){const f=db.site.footer,L=f.links||{};return ph(hs(['Footer & contact']),'Footer & contact','Your contact details, social links and copyright line at the bottom of every page and in the side menu.',B('✎ Edit','editFoot()','pr'))+`<div class="card"><div class="kv"><b>About text</b><span>${E(f.about)}</span><b>Address</b><span>${E(f.address)}</span><b>Phone</b><span>${E(f.phone)}</span><b>Email</b><span>${E(f.email)}</span><b>Instagram</b><span>${E(L.Instagram)}</span><b>WhatsApp</b><span>${E(L.WhatsApp)}</span><b>Facebook</b><span>${E(L.Facebook)}</span><b>Copyright</b><span>${E(f.copy)}</span></div></div>`}
function editFoot(){const f=db.site.footer,L=f.links=f.links||{};form({title:'Edit footer & contact',data:{...f,ig:L.Instagram,wa:L.WhatsApp,fb:L.Facebook},fields:[{k:'about',l:'About text',t:'area'},{k:'address',l:'Shop address'},{k:'phone',l:'Phone number'},{k:'email',l:'Email'},{k:'ig',l:'Instagram link'},{k:'wa',l:'WhatsApp link (https://wa.me/91XXXXXXXXXX)'},{k:'fb',l:'Facebook link'},{k:'copy',l:'Copyright line'}],onSave:async v=>{Object.assign(f,{about:v.about,address:v.address,phone:v.phone,email:v.email,copy:v.copy});L.Instagram=v.ig;L.WhatsApp=v.wa;L.Facebook=v.fb;f.social=['Instagram','WhatsApp','Facebook'];render();await saveDB()}})}
function payP(){const p=db.site.payment,r=db.site.rental;return ph(hs(['Payment & booking form']),'Payment & booking form','What customers see when they pay for a booking.',B('✎ Edit payment','editPay()','pr'))+`<div class="card"><div class="kv"><b>Title</b><span>${E(p.title)}</span><b>Advance to pay</b><span>${E(p.advancePercent)}%</span><b>UPI ID</b><span>${E(p.upiId)}</span><b>Note</b><span>${E(p.note)}</span><b>Deposit note</b><span>${E(r.deposit_note)}</span><b>Form button</b><span>${E(r.submit)}</span></div></div><div class="tools">${B('+ Add payment method','editPm(null)','pr')}</div>`+p.methods.map((m,i)=>`<div class="r"><div class="c"><b>${E(m.name)}</b><small>${E(m.details)}</small></div><span class="tag ${m.enabled?'ok':'no'}">${m.enabled?'On':'Off'}</span><div class="a">${B('Edit','editPm('+i+')','sm')}${B('Delete','delPm('+i+')','sm d')}</div></div>`).join('')}
function editPay(){const p=db.site.payment,r=db.site.rental;form({title:'Edit payment',data:{...p,dn:r.deposit_note,sb:r.submit},fields:[{k:'title',l:'Payment window title'},{k:'advancePercent',l:'Advance to pay (%)',t:'num'},{k:'upiId',l:'UPI ID'},{k:'note',l:'Note shown to customer',t:'area'},{k:'dn',l:'Deposit note (booking form)',t:'area'},{k:'sb',l:'Booking form button text'}],onSave:async v=>{Object.assign(p,{title:v.title,advancePercent:v.advancePercent,upiId:v.upiId,note:v.note});r.deposit_note=v.dn;r.submit=v.sb;render();await saveDB()}})}
function editPm(i){const a=db.site.payment.methods,m=i==null?{name:'',details:'',enabled:true}:a[i];form({title:i==null?'Add payment method':'Edit payment method',submit:i==null?'Upload':'Done',data:m,fields:[{k:'name',l:'Name'},{k:'details',l:'Instructions',t:'area'},{k:'enabled',l:'Show to customers',t:'chk'}],validate:v=>v.name?'':'Please enter a name',onSave:async v=>{if(i==null)a.push(v);else Object.assign(m,v);render();await saveDB()}})}
async function delPm(i){if(!confirm('Remove this payment method?'))return;db.site.payment.methods.splice(i,1);render();await saveDB()}
function secuP(){return ph(hs(['Password']),'Owner password','Change the password you use to log in here. Use at least 8 characters.',B('Change password','chpw()','pr'))}
async function chpw(){form({title:'Change password',submit:'Change',fields:[{k:'o',l:'Current password'},{k:'n',l:'New password (8+ characters)'},{k:'c',l:'Type the new password again'}],validate:v=>v.n.length<8?'Use at least 8 characters':v.n!=v.c?'The two new passwords do not match':'',onSave:async v=>{const r=await fetch('/api/admin/password',{method:'POST',headers:H(),body:JSON.stringify({old:v.o,new:v.n})});let j={};try{j=await r.json()}catch{}alert(r.ok?'Password changed':(j.error||'Could not change password'))}})}
