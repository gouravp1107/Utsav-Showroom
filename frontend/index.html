<style>


*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}

nav{display:flex;gap:30px;margin:0 auto}nav a{text-decoration:none;font:500 14px Jost;padding:8px 0;border-bottom:2px solid transparent;color:var(--tx)}nav a:hover,nav a.on{color:var(--m);border-color:var(--g)}.dark nav a:hover,.dark nav a.on{color:var(--g)}
.search{display:flex;align-items:center;gap:10px;width:280px;height:40px;padding:0 16px;background:var(--cr);border:1px solid var(--ln);border-radius:22px}.search svg{width:18px;height:18px;fill:none;stroke:var(--mu);stroke-width:1.8;flex:none}.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:13px Jost;color:var(--tx)}
.ic{display:flex;gap:6px}.ic button{position:relative;width:40px;height:40px;border-radius:50%;background:none;color:var(--tx);font-size:19px;display:grid;place-items:center}.ic button:hover{background:var(--cr)}.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}.ic em{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--m);color:#fff;font:700 10px/17px Jost;font-style:normal;text-align:center}

.md{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}.md.o{display:flex}

.mb label{display:block;margin:12px 0;font-size:13px}.mb label:has(input[type=radio]){border:1px solid var(--ln);border-radius:12px;padding:12px 14px;cursor:pointer}.mb label:has(input:checked){border-color:#c9892f;background:var(--cr)}.mb .mi{margin-top:6px}.mb .btn{margin:6px 8px 0 0;height:42px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2a0c14;color:#f6dfae;border:1px solid #c9892f;padding:12px 24px;border-radius:30px;opacity:0;transition:.3s;font:14px Jost;z-index:80;pointer-events:none}#toast.s{opacity:1;transform:translate(-50%,0)}
.ci{display:flex;align-items:center;gap:18px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}.ci img{width:72px;height:90px;object-fit:cover;border-radius:10px}.ci div{flex:1}
